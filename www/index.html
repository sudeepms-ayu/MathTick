function applyBg(){document.documentElement.style.setProperty("--bgfull",bgCss(S.bg)||DEF);const el=$("#bg");el.classList.remove("sw2");void el.offsetWidth;el.classList.add("sw2")}
function applyTheme(){const h=document.documentElement;h.classList.add("tx");clearTimeout(h._t);h._t=setTimeout(()=>h.classList.remove("tx"),550);h.dataset.theme=S.th=="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):S.th}

/* ---- ui helpers ---- */
const sw=(k,on,c="ek")=>`<label class="sw"><input type="checkbox" data-c="${c}" data-k="${k}" ${on?"checked":""}><i></i></label>`,
seg=(k,o,cur)=>`<div class="seg">${o.map(([v,n])=>`<button data-a="sg" data-k="${k}" data-v="${v}" class="${cur==v?"on":""}">${n}</button>`).join("")}</div>`,
chip=(k,v,n,c)=>`<button class="cp ${c==v?"on":""}" data-a="ch" data-k="${k}" data-v="${v}">${n}</button>`;
let tt,undo;function toast(m,u){const t=$("#toast");t.innerHTML=esc(m)+(u?`<button data-a="undo">Undo</button>`:"");t.classList.add("on");undo=u;clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),3600)}
function sheet(h){$("#shb").innerHTML=h;$("#shw").classList.add("on")}
/* ---- alarms page ---- */
const card=(a,i)=>`<div class="row" data-id="${a.id}" style="--i:${i};view-transition-name:r${a.id}"><div class="act e">${ic("pen")}</div><div class="act d">${ic("trash")}</div><div class="card" data-a="open"><div class="top"><div class="tm">${big(a.h,a.m)}</div><div class="rt">${sw("tg",a.on,"tg")}${a.on&&a.at?`<span class="chip" data-at="${a.at}">${cd(a.at-Date.now())}</span>`:""}</div></div><div class="lb">${esc(a.label)} <span class="bd ${a.mode=="math"?"m":""}">${a.mode=="math"?"+ Arithmetic":"Simple"}</span><button class="dl" data-a="rm" aria-label="Delete alarm">${ic("trash",18)}</button></div><div class="ds">${[..."MTWTFSS"].map((d,k)=>`<b class="dy ${a.days.includes(k)?"x":""}" data-a="dy" data-k="${k}">${d}</b>`).join("")}</div>${a.date?`<div class="dt">On ${a.date}</div>`:""}</div></div>`;
function r0(){const on=S.al.filter(a=>a.on&&a.at).sort((x,y)=>x.at-y.at),off=S.al.filter(a=>!(a.on&&a.at)).sort((x,y)=>x.h*60+x.m-y.h*60-y.m);let h=`<h1><span>Alarms</span>${S.ask?`<button class="pill sm" data-a="ask">${ic("chat",17)}Ask</button>`:""}<button class="ib ins2" data-a="hist" aria-label="Wake-up history">${ic("bars")}</button></h1><div class="qa">${ic("pen",20)}<input class="in" id="qi" placeholder="Type an alarm, e.g. 6:30am weekdays" enterkeyhint="done"></div>`,l="",i=0;
on.forEach(a=>{const g=dayLbl(a.at);if(g!=l){h+=`<h4>${g}</h4>`;l=g}h+=card(a,i++)});if(off.length)h+=`<h4>Won’t ring</h4>`+off.map(a=>card(a,i++)).join("");
if(!S.al.length)h+=`<div class="empty">${ic("clock",44)}<br>No alarms yet.<br>Tap + or type one above.</div>`;$("#p0").innerHTML=h}
/* ---- tones page ---- */
const ft=x=>{x=Math.round(x);return Math.floor(x/60)+":"+pad(x%60)};
const urow=u=>`<div class="r2" data-a="pick" data-k="${u[0]}"><button class="pb2" data-a="pv" data-k="${u[0]}">${ic(pl==u[0]?"pause":"play",16)}</button><span class="gr">${esc(u[1])}<small>${u[4]>u[3]?"Plays "+ft(u[3])+" – "+ft(u[4]):"Plays from the start"}</small></span><button class="pb2" data-a="trm" data-k="${u[0]}" aria-label="Choose part of the song">${ic("scissors",16)}</button><button class="pb2" data-a="udl" data-k="${u[0]}" aria-label="Remove sound">${ic("trash",16)}</button>${S.tone==u[0]?ic("check",20):""}</div>`;
const row=(id,n)=>`<div class="r2" data-a="pick" data-k="${id}"><button class="pb2" data-a="pv" data-k="${id}">${ic(pl==id?"pause":"play",16)}</button><span class="gr">${esc(n)}</span>${S.tone==id?ic("check",20):""}</div>`;
function r1(){$("#p1").innerHTML=`<h1>Tones</h1><div class="hero"><small>ALARM SOUND</small><b>${esc(nm(S.tone))}</b><button class="pb" data-a="pv" data-k="${S.tone}">${ic(pl==S.tone?"pause":"play",22)}</button></div><h4>Your sounds</h4><div class="grp">${U.map(urow).join("")}<div class="r2" data-a="imp" style="color:var(--gold)"><span>＋ Import a sound</span><em>MP3, WAV, M4A</em></div></div><h4>Melodic · easier to wake to</h4><div class="grp">${TN.slice(0,5).map(t=>row(t[0],t[1])).join("")}</div><p class="note">Melodic alarms tend to feel gentler than beeping.</p><h4>Classic tones</h4><div class="grp">${TN.slice(5).map(t=>row(t[0],t[1])).join("")}</div>`}
/* ---- themes page ---- */
const sq=(k,css,x="")=>`<button class="sq" data-a="bg" data-k="${k}" style="background:${css||"var(--soft)"}">${x}${S.bg==k?`<span class="ck">${ic("check",16)}</span>`:""}</button>`;
function r2(){$("#p2").innerHTML=`<h1>Themes</h1><div class="grp"><div class="r2 dft" data-a="bg" data-k=""><img src="${LOGO}" alt=""><span class="gr"><b>Default</b><small>MathTick’s own look · follows light/dark</small></span>${!S.bg?`<span class="ck2">${ic("check",18)}</span>`:""}</div></div><div class="grp"><h4 style="margin:16px 20px 0">Custom</h4><div class="sg c2" style="grid-template-columns:1fr"><button class="sq" data-a="photo" style="aspect-ratio:auto;padding:18px;background:var(--soft);color:var(--ink);border-style:dashed;justify-content:start;display:flex;gap:14px;text-align:left">${ic("img",28)}<span><b>Choose from photos</b><br><small style="color:var(--ink2)">JPG, PNG, HEIC or WebP</small></span>${S.bg=="p"?`<span class="ck">${ic("check",16)}</span>`:""}</button></div></div>
<div class="grp"><h4 style="margin:16px 20px 0">Solid color</h4><div class="sg">${SOL.map((c,i)=>sq("s"+i,c)).join("")}</div></div>
<div class="grp"><h4 style="margin:16px 20px 0">Gradient</h4><div class="sg">${GR.map((c,i)=>sq("g"+i,c)).join("")}</div></div>
<div class="grp"><h4 style="margin:16px 20px 0">Texture</h4><div class="sg">${TX.map((c,i)=>sq("t"+i,c)).join("")}</div></div>
