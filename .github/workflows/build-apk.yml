name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Create package.json and capacitor.config.json
        run: |
          cat > package.json <<'JSON'
          {"name":"mathtick","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.1.0","@capacitor/cli":"^6.1.0","@capacitor/core":"^6.1.0"}}
          JSON
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.mathtick.app","appName":"MathTick","webDir":"www","android":{"allowMixedContent":false}}
          JSON
      - run: npm install
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#0b1a08' --iconBackgroundColorDark '#0b1a08' --splashBackgroundColor '#0b1a08' --splashBackgroundColorDark '#0b1a08'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: MathTick-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
